<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#19191c">
<meta name="robots" content="noindex, nofollow">
<title>Shared with you</title>
<link rel="icon" href="/s/static/icon-small.svg" type="image/svg+xml">
<link rel="stylesheet" href="/s/static/app.css">
<script src="/s/static/share.js" defer></script>
</head>
<body>
<header class="topbar">
  <span class="brand">
    <img src="/s/static/icon.svg" alt="" width="28" height="28">
    <span class="brand-name">Shared <span class="brand-accent">with you</span></span>
  </span>
</header>

<main class="share-page">
  <p id="share-message" class="notice" hidden></p>

  <form id="lock" class="share-lock" autocomplete="off" hidden>
    <h1 class="dialog-title">This link has a password</h1>
    <label class="field">Password
      <input class="input" id="lock-password" type="password" maxlength="200" required autocomplete="current-password">
    </label>
    <button class="btn send" type="submit">Open</button>
  </form>

  <section id="shared" hidden>
    <div class="toolbar">
      <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
      <a class="btn ghost" id="zip" href="#" hidden>Download all as zip</a>
    </div>
    <p id="expiry" class="field"></p>
    <div id="items" class="items list" role="list"></div>
    <p id="empty-state" class="empty-state" hidden>This folder is empty.</p>
  </section>
</main>

<dialog id="viewer" class="viewer" aria-label="Preview">
  <div class="viewer-head">
    <h2 class="viewer-name" id="viewer-name"></h2>
    <a class="btn ghost" id="viewer-download" href="#">Download</a>
    <button class="btn ghost" type="button" id="viewer-close">Close</button>
  </div>
  <div class="viewer-stage" id="viewer-stage"></div>
</dialog>
</body>
</html>
