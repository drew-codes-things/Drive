name: drive
services:
  drive:
    build: ..
    image: drive:latest
    container_name: drive
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 200
    env_file: /etc/drive/drive.env
    volumes:
      - __DRIVE_DATA__:/data
    ports:
      - "__CORE_ADDRESS__:__HOST_PORT__:8080"
